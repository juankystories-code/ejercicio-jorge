# /etc/nginx/sites-available/odoo-ua2
# Versión de la PRIMERA FASE (apartado 6, solo HTTP).
# Un único "server" en el puerto 80 con las "location" del bloque 443 de la versión final.

upstream odoo_ua2 {
    server 127.0.0.1:8069;          # DESTINO: Odoo
}

# --- HTTP (Ubuntu:80  <-  Windows:18080)
server {
    listen 80;                      # ESCUCHA
    server_name localhost;

    access_log /var/log/nginx/odoo-ua2.access.log;
    error_log  /var/log/nginx/odoo-ua2.error.log;

    client_max_body_size 64m;
    proxy_read_timeout   720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout   720s;

    location / {
        proxy_pass http://odoo_ua2;

        # CABECERAS que necesita Odoo (proxy_mode = True)
        # $http_host = "localhost:18080" (incluye el puerto que escribió el navegador).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_redirect off;
    }

    # Chat/notificaciones en tiempo real de Odoo
    location /websocket {
        proxy_pass http://odoo_ua2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
