# /etc/nginx/sites-available/odoo-ua2
# Versión FINAL (apartado 6, con HTTPS). Para la primera fase (solo HTTP)
# usa únicamente el bloque "server" del puerto 80 con las "location" del bloque 443.

upstream odoo_ua2 {
    server 127.0.0.1:8069;          # DESTINO: Odoo, solo en la interfaz local
}

# --- HTTP (Ubuntu:80  <-  Windows:18080) -> redirige a HTTPS conservando la ruta
server {
    listen 80;                      # ESCUCHA
    server_name localhost;

    # Se fija 18443 a mano: Nginx ve el puerto 80/443 de Ubuntu,
    # no sabe que en Windows el puerto es 18080/18443.
    return 301 https://localhost:18443$request_uri;
}

# --- HTTPS (Ubuntu:443  <-  Windows:18443)
server {
    listen 443 ssl;                 # ESCUCHA
    server_name localhost;

    ssl_certificate     /etc/ssl/certs/odoo-ua2.crt;
    ssl_certificate_key /etc/ssl/private/odoo-ua2.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/odoo-ua2.access.log;
    error_log  /var/log/nginx/odoo-ua2.error.log;

    client_max_body_size 64m;
    proxy_read_timeout   720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout   720s;

    location / {
        proxy_pass http://odoo_ua2;

        # CABECERAS que necesita Odoo (proxy_mode = True)
        # $http_host = "localhost:18443" (incluye el puerto que escribió el navegador).
        # Con $host se perdería el puerto y Odoo redirigiría a https://localhost/ (roto).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_redirect off;
    }

    # Chat/notificaciones en tiempo real de Odoo
    location /websocket {
        proxy_pass http://odoo_ua2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
